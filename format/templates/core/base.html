<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>{% block title %} {% endblock %} | Link</title>
  </head>
  <body class="bg-gray-100 text-gray-900">
    <!-- Navbar -->
    <nav class="flex items-center justify-between p-6 bg-gray-800">
      <a href="/" class="text-xl text-cyan-500 font-semibold">Link</a>
      <div class="space-x-4">
        <a href="{% url 'about' %}" class="text-white hover:text-cyan-300">About</a>
        <a href="{% url 'pricing' %}" class="text-white hover:text-cyan-300">Pricing</a>

        {% if request.user.is_authenticated %}
          <a href="{% url 'logout' %}" class="text-white bg-red-600 rounded-xl py-2 px-4 hover:bg-red-700">Log out</a>
        {% else %}
          <a href="{% url 'signup' %}" class="text-white bg-cyan-800 rounded-xl py-2 px-4 hover:bg-cyan-700">Sign up</a>
          <a href="{% url 'login' %}" class="text-white bg-gray-600 rounded-xl py-2 px-4 hover:bg-gray-500">Log in</a>
        {% endif %}
      </div>
    </nav>

    <!-- Main Content -->
    <main class="p-6">
      {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 p-6 text-center">
      <p class="text-xs text-gray-400">My website &copy; 2025</p>
    </footer>
  </body>
</html>
